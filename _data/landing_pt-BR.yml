privacy_title: Pratique com suas próprias gravações
privacy_intro: Suas gravações de reuniões, transcrições e gravações de shadowing nunca são enviadas aos servidores do desenvolvedor do Phrabbit. Depois de baixar um modelo de idioma compatível, você pode transcrever áudios locais e praticar sem internet.
privacy_note: O reconhecimento de fala usa modelos no aparelho sempre que disponíveis. A Apple Intelligence traduz e explica palavras no próprio aparelho. Em alguns sistemas mais antigos ou em idiomas sem modelo local compatível, o áudio pode ser enviado ao serviço de reconhecimento de fala da Apple. É preciso ter internet para baixar modelos ou reproduzir YouTube e podcasts por streaming.
pricing_title: Grátis e Premium
pricing_intro: Experimente todos os recursos por 3 dias (72 horas). Ao fim do teste, você pode continuar na versão grátis sem cobrança automática. Uma compra única libera todos os recursos Premium atuais.
pricing_note: Consulte o preço da sua região na App Store. Você pode restaurar a compra no iPhone ou no iPad com a mesma Conta Apple usada para comprar o Premium.
