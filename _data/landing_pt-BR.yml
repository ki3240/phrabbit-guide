features:
  - title: Estude com o que você já ouve
    summary: Abra o YouTube no player integrado, busque podcasts ou adicione um feed RSS. Você também pode importar áudios, vídeos, gravações e músicas sem DRM.
    details: Adicione legendas SRT, VTT ou SMI a um vídeo local. Quando o vídeo do YouTube tem legendas compatíveis, dá para praticar frase por frase com os cartões de legenda.
    images:
      - {id: add, alt: "Menu para adicionar áudio, vídeo, podcast ou link do YouTube"}
      - {id: youtube, alt: Vídeo do YouTube com o trecho A/B e o cartão de legenda correspondente}
  - title: Repita só o trecho que você não entendeu
    summary: Toque em um cartão de legenda e arraste os pontos A e B para escolher o trecho. Nos arquivos de áudio, você pode ajustar o zoom da forma de onda para ver de 2 a 15 segundos por linha.
    details: Escolha a velocidade, o número de repetições e a pausa entre elas. Grave sua voz e compare com o original, ou tente escrever o que ouviu.
    images:
      - {id: loop, alt: Pontos A e B delimitando uma frase na forma de onda}
      - {id: shadow, alt: Controles para comparar a gravação de shadowing com o áudio original}
  - title: Acompanhe as legendas geradas no aparelho
    summary: Transforme seus áudios e podcasts baixados em cartões de legenda sincronizados com a forma de onda. Você também pode transcrever um trecho de um vídeo local.
    details: Oculte ou edite as legendas enquanto pratica. Em aparelhos compatíveis, use a Apple Intelligence para traduzir legendas e consultar explicações de palavras. Salve as palavras e revise com cartões de estudo.
    images:
      - {id: translation, alt: Cartões de legenda com o texto original e a tradução em português}
      - {id: word-detail, alt: Palavra salva no Vocabulário com a frase em que aparece}
