faq:
  - question: Vou receber uma cobrança quando o teste grátis acabar?
    answer: Não. O teste termina depois de 72 horas e os recursos grátis continuam disponíveis. Você só paga se escolher comprar o Premium. A compra é única e pode ser restaurada no iPhone ou no iPad com a mesma Conta Apple.
  - question: Quais áudios, vídeos e outros materiais posso usar?
    answer: Use arquivos locais como MP3, M4A e MP4, inclusive gravações de voz, ou importe faixas sem DRM da biblioteca do app Música. As faixas da assinatura do Apple Music têm proteção por DRM. Você pode buscar podcasts ou adicioná-los por RSS e baixar episódios com o Premium. O app reproduz vídeos do YouTube no player integrado e aceita legendas SRT, VTT e SMI em vídeos locais.
  - question: Dá para repetir só um ou dois segundos?
    answer: Sim. Toque em um cartão de legenda e arraste os pontos A e B para encurtar o trecho. Em áudios, use a forma de onda. Em vídeos locais e no YouTube, use a régua de tempo. Também dá para ajustar a velocidade, o número de repetições e a pausa entre elas.
  - question: Posso transcrever uma gravação de voz ou de reunião no próprio aparelho?
    answer: Sim, com um modelo de idioma local compatível instalado. O Phrabbit não envia o áudio aos servidores do desenvolvedor. Se o reconhecimento local não estiver disponível, o serviço de fala da Apple poderá processar o áudio nos servidores da Apple.
  - question: Posso praticar ou gerar legendas sem internet?
    answer: Com um modelo de idioma local compatível já instalado, você pode transcrever arquivos locais e podcasts baixados e praticar sem conexão. É preciso ter internet para assistir ao YouTube ou baixar novos episódios e modelos de idioma.
  - question: Como funcionam a gravação de shadowing e o ditado?
    answer: Com o Premium ou durante o teste, você pode gravar sua voz, comparar com o original e salvar a gravação. No ditado, o app compara automaticamente a resposta digitada com a legenda. No iPad, você mesmo confere a resposta escrita à mão com o original.
  - question: Quais aparelhos oferecem tradução de legendas e explicações de palavras com IA?
    answer: A tradução de legendas exige iOS ou iPadOS 26.4 ou posterior. As explicações de palavras exigem a versão 26 ou posterior. Os dois recursos precisam de um aparelho compatível com a Apple Intelligence, com o recurso ativado e pronto para uso, de um idioma compatível e do Premium ou de um teste ativo.
  - question: Posso sair do app durante a transcrição ou ouvir com a tela bloqueada?
    answer: Mantenha o app aberto enquanto gera legendas. Com o Premium ou durante o teste, ative a reprodução em segundo plano para ouvir áudios locais e podcasts baixados com a tela bloqueada. Os vídeos, inclusive os do YouTube, pausam quando o app vai para segundo plano.
  - question: Quais idiomas posso praticar?
    answer: Você pode repetir trechos e praticar shadowing com gravações em inglês, japonês, coreano, chinês, espanhol e outros idiomas. A disponibilidade das legendas automáticas e da tradução depende do idioma, do aparelho e dos modelos instalados. O app e os guias estão disponíveis em oito idiomas.
