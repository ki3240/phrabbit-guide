features:
  - title: Aprende con lo que ya escuchas
    summary: Abre un video de YouTube en el reproductor integrado, busca podcasts o añádelos por RSS. También puedes importar tus audios, videos, grabaciones y música sin DRM.
    details: Añade subtítulos SRT, VTT o SMI a un video local. Si un video de YouTube tiene subtítulos compatibles, puedes practicar frase por frase con sus tarjetas.
    images:
      - {id: add, alt: "Menú para añadir audio, video, podcasts o enlaces de YouTube"}
      - {id: youtube, alt: Video de YouTube con el tramo A/B marcado y su tarjeta de subtítulos}
  - title: Repite justo el tramo que te cuesta
    summary: Toca una tarjeta de subtítulos y arrastra los puntos A y B para elegir el tramo. En un archivo de audio puedes ajustar el zoom de la forma de onda entre 2 y 15 segundos por fila.
    details: Ajusta la velocidad, el número de repeticiones y la pausa entre ellas. Grábate y compara tu voz con el original, o escribe lo que oíste.
    images:
      - {id: loop, alt: Frase delimitada por los puntos A y B en la forma de onda}
      - {id: shadow, alt: Controles para comparar la grabación de shadowing con el original}
  - title: Sigue la frase con subtítulos generados en tu dispositivo
    summary: Convierte tus audios y podcasts descargados en tarjetas de subtítulos sincronizadas con la forma de onda. También puedes transcribir un tramo de un video local.
    details: Oculta o edita los subtítulos mientras practicas. En dispositivos compatibles, puedes traducirlos, consultar explicaciones de palabras con Apple Intelligence y guardar vocabulario para repasarlo con tarjetas.
    images:
      - {id: translation, alt: Tarjetas con el subtítulo original y su traducción al español}
      - {id: word-detail, alt: Una palabra guardada con su frase de ejemplo en Vocabulario}
ipad_title: Escucha y escribe a mano en el iPad
ipad_player: En horizontal puedes ver el video y las tarjetas de subtítulos lado a lado.
ipad_handwriting: Escribe con Apple Pencil y compara tu respuesta con el original.
privacy_title: Practica con tus propias grabaciones
privacy_intro: Las grabaciones de reuniones, las transcripciones y tus grabaciones de shadowing nunca se envían a los servidores del desarrollador de Phrabbit. Tras descargar un modelo de idioma compatible, puedes transcribir tus audios y practicar sin conexión.
privacy_note: El reconocimiento de voz usa modelos del dispositivo cuando están disponibles. Apple Intelligence traduce y explica palabras en el propio dispositivo. En algunos sistemas antiguos o en idiomas sin un modelo local compatible, el audio puede enviarse al servicio de reconocimiento de voz de Apple. Descargar modelos y reproducir YouTube o podcasts en línea requiere conexión.
pricing_title: Gratis y Premium
pricing_intro: Prueba todas las funciones durante 3 días (72 horas). Al terminar la prueba, puedes seguir usando la versión gratuita sin ningún cargo automático. Un pago único desbloquea todas las funciones Premium actuales.
pricing_note: Consulta el precio en el App Store de tu región. Puedes restaurar la compra en un iPhone o iPad con la misma cuenta de Apple que usaste para comprar Premium.
