faq:
  - question: ¿Me cobrarán cuando termine la prueba gratuita?
    answer: No. La prueba termina al cabo de 72 horas y las funciones gratuitas siguen disponibles. Solo pagas si decides comprar Premium. Es un pago único y puedes restaurar la compra en un iPhone o iPad con la misma cuenta de Apple.
  - question: ¿Qué archivos de audio, videos y otros materiales puedo usar?
    answer: Puedes usar archivos locales como MP3, M4A y MP4, incluidas tus grabaciones, y pistas sin DRM de la biblioteca de Música. Las pistas de la suscripción a Apple Music están protegidas por DRM. Puedes buscar podcasts o añadirlos por RSS y descargarlos con Premium, ver YouTube en el reproductor integrado y añadir subtítulos SRT, VTT o SMI a tus videos locales.
  - question: ¿Puedo repetir solo uno o dos segundos?
    answer: Sí. Toca una tarjeta de subtítulos y arrastra los puntos A y B para acortar el tramo. En los audios se ajusta sobre la forma de onda y en los videos locales y YouTube, sobre la regla de tiempo. También puedes cambiar la velocidad, el número de repeticiones y la pausa entre ellas.
  - question: ¿Puedo transcribir una grabación de voz o de una reunión en mi dispositivo?
    answer: Sí, si tienes instalado un modelo de idioma local compatible. Phrabbit no envía tu audio a sus servidores. Si el reconocimiento local no está disponible, el servicio de voz de Apple puede procesar el audio en sus servidores.
  - question: ¿Puedo practicar o generar subtítulos sin conexión?
    answer: Con un modelo de idioma local compatible ya instalado, puedes transcribir archivos locales y podcasts descargados y practicar sin conexión. Necesitas internet para reproducir YouTube o descargar nuevos episodios o modelos de idioma.
  - question: ¿Cómo funcionan las grabaciones de shadowing y el dictado?
    answer: Con Premium o durante la prueba puedes grabar tu voz, compararla con el original y guardarla. En el dictado, lo que escribes con el teclado se compara automáticamente con los subtítulos. En el iPad puedes comparar tú mismo la respuesta escrita a mano con el original.
  - question: ¿Qué dispositivos permiten traducir subtítulos y explicar palabras con IA?
    answer: La traducción de subtítulos requiere iOS o iPadOS 26.4 o posterior. Las explicaciones de palabras requieren la versión 26 o posterior. Ambas funciones necesitan un dispositivo compatible con Apple Intelligence, la función activada y lista, un idioma compatible y Premium o una prueba activa.
  - question: ¿Puedo salir de la app mientras transcribe o escuchar con la pantalla bloqueada?
    answer: Mantén la app abierta mientras se generan los subtítulos. Con Premium o durante la prueba, activa la reproducción en segundo plano para escuchar audios locales y podcasts descargados con la pantalla bloqueada. Los videos, incluidos los de YouTube, se pausan en segundo plano.
  - question: ¿Qué idiomas puedo practicar?
    answer: Puedes escuchar y repetir grabaciones en inglés, japonés, coreano, chino, español y otros idiomas. Los subtítulos automáticos y la traducción dependen del idioma, del dispositivo y de los modelos instalados. La app y las guías están disponibles en ocho idiomas.
