faq:
  - question: 免費試用到期後會自動扣款嗎？
    answer: 不會。72 小時試用期滿後，仍可繼續使用免費功能。只有你主動購買進階版時，才會收取一次費用。換用 iPhone 或 iPad 時，可以用同一個 Apple 帳號還原購買。
  - question: 可以用哪些音訊、影片或其他素材練習？
    answer: 可以匯入 MP3、M4A、MP4 等本機檔案、個人錄音，以及音樂資料庫中不受 DRM 保護的曲目。Apple Music 訂閱曲目受 DRM 保護。你也可以搜尋 Podcast、加入 RSS，或串流播放 YouTube。進階版可下載 Podcast。本機影片可匯入 SRT、VTT 和 SMI 字幕。
  - question: 能只重播沒聽清楚的那一兩秒嗎？
    answer: 可以。先點一句字幕，再拖曳 A/B 端點縮小循環範圍。音訊用波形選區間，本機影片和 YouTube 則用時間尺。也能調整播放速度、重複次數和每次重播之間的停頓。
  - question: 個人錄音或會議錄音能直接在裝置上轉成文字嗎？
    answer: 安裝支援的裝置端語言模型後，即可在裝置上將會議錄音轉成文字。Phrabbit 開發者不會收到你的錄音。若裝置端辨識無法使用，音訊可能會由 Apple 的語音辨識伺服器處理。
  - question: 離線時也能練習和產生字幕嗎？
    answer: 事先下載支援的語言模型後，你可以離線使用本機檔案和已下載的 Podcast 來練習、產生字幕。串流播放 YouTube、下載新的 Podcast 單集或語言模型時則需要網路連線。
  - question: 跟讀錄音與聽寫要怎麼練習？
    answer: 使用進階版或免費試用期間，可以錄下自己的跟讀，和原音比較並儲存錄音。用鍵盤輸入的聽寫答案會自動與字幕比對。在 iPad 上手寫的答案則由你自己對照原文訂正。
  - question: 哪些裝置可以使用 AI 字幕翻譯和單字解說？
    answer: 字幕翻譯需要 iOS 或 iPadOS 26.4 以上版本，單字解說需要 26 以上版本。兩者都需要支援並已啟用 Apple Intelligence 的裝置、就緒的模型、受支援的語言，以及進階版或有效的免費試用。
  - question: 產生字幕時可以切換 App 嗎？鎖定螢幕後還能繼續聽嗎？
    answer: 產生字幕時，請讓 Phrabbit 保持在前景。使用進階版或免費試用時，開啟背景播放即可在鎖定螢幕後繼續聽本機音訊和已下載的 Podcast。影片進入背景時會暫停播放，包括 YouTube 影片。
  - question: 可以練習哪些語言？
    answer: 你可以用英語、日語、韓語、中文、西班牙語等語言的錄音來反覆聽、跟讀。能否自動產生字幕或翻譯，會依語言、裝置及已安裝的模型而異。App 與使用指南提供 8 種語言。
