title: Phrabbit — 在 iPhone 和 iPad 上練習 A/B 區間循環、跟讀與聽寫
description: 用 YouTube、Podcast 和自己的影音檔練聽力。在波形上選出沒聽清楚的片段反覆聽，搭配裝置上產生的字幕練習跟讀與聽寫。
