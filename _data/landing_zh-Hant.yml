headline: 聽一遍，再聽一遍，開口跟讀。
intro: 用 YouTube、Podcast 和自己的影音檔練聽力。點一下字幕，挑出沒聽清楚的那一兩秒反覆聽，再跟著念一遍。
mobile_intro: 用自己的影音檔，把沒聽清楚的那句話再聽幾遍。
trademark: Apple、Apple 標誌、Apple Intelligence、Apple Pencil、iPad、iPadOS 和 iPhone 是 Apple Inc. 的商標。App Store、Apple Music 和 Apple Podcasts 是 Apple Inc. 的服務標章。IOS 是 Cisco 在美國及其他國家和地區的商標或註冊商標，經授權使用。
highlights: [自選學習素材, 在裝置上產生字幕, 3 天免費試用 · 一次買斷，無須訂閱]
hero_alt: 音訊波形上的 A/B 循環區間，以及所選英文句子和下方的繁體中文翻譯
features:
  - title: 用平常在聽、在看的內容練習
    summary: 用內嵌播放器看 YouTube，搜尋 Podcast 或加入 RSS，也可以匯入自己的影音檔、會議錄音和不受 DRM 保護的音樂。
    details: 本機影片可以搭配 SRT、VTT 或 SMI 字幕。如果 YouTube 影片提供支援的字幕，也能點字幕卡片逐句練習。
    images:
      - {id: add, alt: 新增音訊、影片、Podcast 和 YouTube 連結的選單}
      - {id: youtube, alt: YouTube 播放器的時間尺標出 A/B 區間，下方顯示對應的字幕卡片}
  - title: 哪一段沒聽清楚，就重聽那一段
    summary: 點一下字幕卡片，再拖曳 A、B 兩個端點，選出想聽的片段。音訊波形可以縮放，每列顯示 2 到 15 秒。
    details: 調整播放速度、重複次數和每次重播之間的停頓。你可以錄下跟讀的聲音，和原音對照著聽，也可以把聽到的內容寫下來。
    images:
      - {id: loop, alt: 音訊波形上的 A、B 兩個端點標出一句話的範圍}
      - {id: shadow, alt: 跟讀畫面上用來比較原音與跟讀錄音的按鈕}
  - title: 邊聽邊看裝置上產生的字幕
    summary: 將音訊和已下載的 Podcast 轉成與波形同步的字幕卡片，也可以選取本機影片中的一段產生字幕。
    details: 練習時可以隱藏或編輯字幕。在支援的裝置上，還能用 Apple Intelligence 翻譯字幕、查看單字在句子裡的用法，再把單字存進單字本，用字卡複習。
    images:
      - {id: translation, alt: 同時顯示原文和中文譯文的字幕卡片}
      - {id: word-detail, alt: 單字本裡儲存的英文單字和對應的例句}
ipad_title: 在 iPad 上邊聽邊寫
ipad_player: 橫向使用時，影片與字幕卡片並排顯示。
ipad_handwriting: 用 Apple Pencil 寫下聽到的內容，再對照原文自己訂正。
privacy_title: 讓你的錄音留在裝置上
privacy_intro: 會議錄音、字幕文字和跟讀錄音都不會傳到 Phrabbit 開發者的伺服器。先下載支援的語言模型，離線時也能為本機音訊產生字幕並繼續練習。
privacy_note: 語音轉文字會優先使用裝置上的模型，Apple Intelligence 翻譯和單字解說也都在裝置上執行。在部分舊版系統上，或某種語言沒有適用的裝置端模型時，音訊可能會傳送至 Apple 的語音辨識服務處理。下載模型、串流 YouTube 或 Podcast 都需要網路連線。
pricing_title: 免費版與進階版
pricing_intro: 免費試用全部功能 3 天（72 小時）。試用期滿後不會自動扣款，你可以繼續使用免費版。目前所有進階功能只需購買一次。
pricing_note: 當地售價請見 App Store。在 iPhone 或 iPad 上登入購買時使用的 Apple 帳號，選擇「還原購買」即可恢復進階版。
