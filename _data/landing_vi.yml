headline: Lắng nghe. Nghe lại. Nói theo.
intro: Luyện nghe với YouTube, podcast và tệp của bạn. Chạm vào một câu, nghe lại một hoặc hai giây chưa rõ rồi nói theo.
mobile_intro: Nghe lại đúng câu bạn chưa nghe rõ trong bản thu hoặc video.
trademark: Apple, logo Apple, Apple Intelligence, Apple Pencil, iPad, iPadOS và iPhone là nhãn hiệu của Apple Inc. App Store, Apple Music và Apple Podcasts là nhãn hiệu dịch vụ của Apple Inc. IOS là nhãn hiệu hoặc nhãn hiệu đã đăng ký của Cisco tại Hoa Kỳ và các quốc gia khác, được sử dụng theo giấy phép.
highlights: [Tài liệu bạn tự chọn, Tạo phụ đề trên thiết bị, "Dùng thử 3 ngày · Mua một lần, không cần thuê bao"]
hero_alt: Đoạn lặp A/B trên dạng sóng và câu tiếng Anh được chọn cùng bản dịch tiếng Việt bên dưới
features:
  - title: Học với những gì bạn vẫn nghe mỗi ngày
    summary: Xem YouTube trong trình phát tích hợp, tìm podcast hoặc thêm qua RSS. Bạn cũng có thể nhập tệp âm thanh, video, bản ghi âm và nhạc không có DRM.
    details: Thêm phụ đề SRT, VTT hoặc SMI vào video trên thiết bị. Với video YouTube có phụ đề tương thích, bạn có thể luyện từng câu bằng thẻ phụ đề.
    images:
      - {id: add, alt: "Menu thêm tệp âm thanh, video, podcast và liên kết YouTube"}
      - {id: youtube, alt: Trình phát YouTube với đoạn lặp A/B và thẻ phụ đề tương ứng}
  - title: Nghe lại đúng đoạn còn vướng
    summary: Chạm vào một thẻ phụ đề rồi kéo hai mốc A và B để chọn đoạn cần nghe. Với tệp âm thanh, bạn có thể thu phóng dạng sóng để mỗi hàng hiển thị từ 2 đến 15 giây.
    details: Điều chỉnh tốc độ, số lần lặp và khoảng nghỉ giữa các lần nghe. Thu âm giọng mình để so sánh với bản gốc, hoặc thử viết lại câu vừa nghe.
    images:
      - {id: loop, alt: Hai mốc A và B trên dạng sóng giới hạn đoạn âm thanh của một câu}
      - {id: shadow, alt: Các nút nghe lại bản gốc và so sánh với giọng vừa thu}
  - title: Nghe và đối chiếu với phụ đề tạo ngay trên thiết bị
    summary: Tạo thẻ phụ đề đồng bộ với dạng sóng từ tệp âm thanh hoặc podcast đã tải. Bạn cũng có thể chọn một đoạn trong video trên thiết bị để tạo phụ đề.
    details: Ẩn hoặc sửa phụ đề trong lúc luyện tập. Trên thiết bị tương thích, bạn có thể dùng Apple Intelligence để dịch phụ đề và xem giải thích từ, rồi lưu từ để ôn bằng thẻ ghi nhớ.
    images:
      - {id: translation, alt: Thẻ phụ đề hiển thị câu gốc và bản dịch tiếng Việt}
      - {id: word-detail, alt: Một từ được lưu trong sổ từ vựng cùng câu có chứa từ đó}
ipad_title: Nghe và viết tay trên iPad
ipad_player: Xoay ngang để xem video và các thẻ phụ đề cạnh nhau.
ipad_handwriting: Viết bằng Apple Pencil rồi tự đối chiếu với câu gốc.
privacy_title: Luyện tập với bản ghi âm riêng tư
privacy_intro: Bản ghi âm cuộc họp, nội dung đã chép lời và bản thu giọng nói khi luyện tập không được gửi đến máy chủ của nhà phát triển Phrabbit. Sau khi tải mô hình ngôn ngữ tương thích, bạn có thể tạo phụ đề và luyện nghe với tệp trên thiết bị khi không có mạng.
privacy_note: Tính năng nhận dạng giọng nói dùng mô hình trên thiết bị khi có thể. Apple Intelligence cũng dịch và giải thích từ ngay trên thiết bị. Với một số hệ điều hành cũ hoặc ngôn ngữ chưa có mô hình cục bộ tương thích, âm thanh có thể được gửi đến dịch vụ nhận dạng giọng nói của Apple. Bạn cần kết nối mạng để tải mô hình hoặc phát trực tuyến YouTube và podcast.
pricing_title: Miễn phí và Premium
pricing_intro: Dùng thử tất cả tính năng trong 3 ngày (72 giờ). Khi hết hạn, bạn vẫn có thể dùng bản miễn phí và sẽ không bị tự động tính phí. Mua một lần để mở khóa toàn bộ tính năng Premium hiện có.
pricing_note: Xem giá tại khu vực của bạn trên App Store. Bạn có thể khôi phục giao dịch mua trên iPhone hoặc iPad bằng Tài khoản Apple đã dùng để mua Premium.
