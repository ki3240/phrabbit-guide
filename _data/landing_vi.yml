title: Phrabbit — Lặp đoạn A/B, luyện nói theo và nghe chép trên iPhone, iPad
description: Luyện ngoại ngữ với YouTube, podcast và tệp âm thanh hoặc video của bạn. Nghe lại câu chưa rõ, nói theo và đối chiếu với phụ đề tạo ngay trên thiết bị.
faq_title: Câu hỏi thường gặp về Phrabbit — Chi phí, cách luyện tập và quyền riêng tư
faq_description: Tìm hiểu những tài liệu bạn có thể dùng, cách dùng thử miễn phí và điều kiện tạo phụ đề khi ngoại tuyến.
