more_questions: Xem tất cả câu hỏi thường gặp
faq:
  - question: Tôi có bị tính phí khi hết thời gian dùng thử không?
    answer: Không. Thời gian dùng thử tự kết thúc sau 72 giờ và bạn vẫn dùng được các tính năng miễn phí. Bạn chỉ thanh toán một lần nếu chủ động mua Premium. Có thể khôi phục giao dịch mua trên iPhone hoặc iPad bằng cùng Tài khoản Apple.
  - question: Tôi có thể luyện với những loại tệp và tài liệu nào?
    answer: Bạn có thể dùng tệp MP3, M4A, MP4 trên thiết bị, kể cả bản ghi âm cá nhân, hoặc nhập các bài hát không có DRM từ thư viện Nhạc. Nhạc từ gói đăng ký Apple Music có bảo vệ DRM. Bạn có thể tìm podcast hoặc thêm qua RSS và tải các tập với Premium, xem YouTube bằng trình phát tích hợp và thêm phụ đề SRT, VTT hoặc SMI cho video trên thiết bị.
  - question: Tôi có thể chỉ lặp lại một hoặc hai giây chưa nghe rõ không?
    answer: Được. Chạm vào thẻ phụ đề rồi kéo hai mốc A và B để thu hẹp đoạn lặp. Với tệp âm thanh, bạn chỉnh trên dạng sóng. Với video trên thiết bị và YouTube, bạn chỉnh trên thước thời gian. Bạn cũng có thể đổi tốc độ, số lần lặp và khoảng nghỉ.
  - question: Có thể chép lời bản ghi âm cá nhân hoặc cuộc họp ngay trên thiết bị không?
    answer: Được, nếu bạn đã cài mô hình ngôn ngữ tương thích trên thiết bị. Phrabbit không gửi âm thanh đến máy chủ của nhà phát triển. Khi không thể nhận dạng ngay trên thiết bị, âm thanh có thể được xử lý trên máy chủ của Apple qua dịch vụ nhận dạng giọng nói.
  - question: Tôi có thể luyện tập hoặc tạo phụ đề khi không có mạng không?
    answer: Nếu đã cài mô hình ngôn ngữ cục bộ tương thích, bạn có thể tạo phụ đề và luyện tập ngoại tuyến với tệp trên thiết bị hoặc podcast đã tải. Bạn cần mạng để xem YouTube, tải tập podcast mới hoặc tải mô hình ngôn ngữ.
  - question: Làm sao để thu âm khi nói theo và luyện nghe chép?
    answer: Với Premium hoặc trong thời gian dùng thử, bạn có thể thu âm giọng mình, so sánh với bản gốc và lưu bản thu. Khi nghe chép bằng bàn phím, ứng dụng tự động đối chiếu câu trả lời với phụ đề. Nếu viết tay trên iPad, bạn tự so sánh bài viết với câu gốc.
  - question: Thiết bị nào hỗ trợ dịch phụ đề và giải thích từ bằng AI?
    answer: Dịch phụ đề cần iOS hoặc iPadOS 26.4 trở lên. Giải thích từ cần phiên bản 26 trở lên. Cả hai tính năng đều cần thiết bị hỗ trợ Apple Intelligence, đã bật và sẵn sàng sử dụng tính năng này, ngôn ngữ tương thích và Premium hoặc thời gian dùng thử còn hiệu lực.
  - question: Tôi có thể rời ứng dụng khi đang tạo phụ đề hoặc nghe tiếp khi khóa màn hình không?
    answer: Hãy giữ ứng dụng mở trong khi tạo phụ đề. Với Premium hoặc trong thời gian dùng thử, bạn có thể bật tính năng phát ở chế độ nền để nghe tệp âm thanh và podcast đã tải khi khóa màn hình. Video, kể cả YouTube, sẽ tạm dừng khi ứng dụng chuyển sang chế độ nền.
  - question: Tôi có thể luyện những ngôn ngữ nào?
    answer: Bạn có thể nghe lặp lại và nói theo các bản thu tiếng Anh, Nhật, Hàn, Trung, Tây Ban Nha và nhiều ngôn ngữ khác. Khả năng tạo phụ đề tự động và dịch phụ thuộc vào ngôn ngữ, thiết bị và mô hình đã cài. Ứng dụng và hướng dẫn sử dụng có 8 ngôn ngữ.
