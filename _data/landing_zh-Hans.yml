faq:
  - question: 免费试用结束后会自动扣费吗？
    answer: 不会。72 小时试用到期后，免费功能仍然可用。只有你主动购买高级版时才会一次性付费。换用 iPhone 或 iPad 时，可以用同一个 Apple 账户恢复购买。
  - question: 可以用哪些音频、视频或其他材料练习？
    answer: 可以导入 MP3、M4A、MP4 等本地文件、个人录音，以及音乐库中不受 DRM 保护的曲目。Apple Music 订阅曲目受 DRM 保护。你还可以搜索播客、添加 RSS 订阅或在线播放 YouTube。高级版支持下载播客。本地视频可导入 SRT、VTT 和 SMI 字幕。
  - question: 能只重复没听清的那一两秒吗？
    answer: 可以。先点一句字幕，再拖动 A/B 端点缩小范围。音频用波形选区间，本地视频和 YouTube 用时间标尺。播放速度、重复次数和两次重复之间的停顿也能调整。
  - question: 个人录音或会议录音能直接在设备上转成文字吗？
    answer: 安装支持的本地语言模型后，就能在设备上把会议录音转成文字。Phrabbit 开发者不会收到你的录音。如果本地识别不可用，音频可能会由 Apple 的语音识别服务器处理。
  - question: 离线时也能练习和生成字幕吗？
    answer: 提前下载支持的语言模型后，你可以离线用本地文件和已下载的播客练习、生成字幕。在线播放 YouTube、下载新的播客单集或语言模型时需要联网。
  - question: 跟读录音和听写是怎么练的？
    answer: 在高级版或免费试用期间，你可以录下跟读，与原声对比并保存。用键盘输入的听写答案会自动与字幕比对。在 iPad 上手写的答案由你自己对照原文订正。
  - question: 哪些设备能用 AI 字幕翻译和单词讲解？
    answer: 字幕翻译需要 iOS 或 iPadOS 26.4 及以上版本，单词讲解需要 26 及以上版本。两项功能都要求设备支持并已启用 Apple Intelligence，模型已就绪，所用语言受支持，且正在使用高级版或免费试用。
  - question: 生成字幕时能切换到其他应用吗？锁屏后还能听吗？
    answer: 生成字幕时请让 Phrabbit 保持在前台。在高级版或免费试用期间，开启后台播放即可在锁屏后继续听本地音频和已下载的播客。视频在后台会暂停，YouTube 视频也是如此。
  - question: 可以用来练习哪些语言？
    answer: 你可以用英语、日语、韩语、汉语、西班牙语等语言的录音来循环播放和跟读。能否自动生成或翻译字幕，取决于语言、设备和已安装的模型。应用和使用指南提供 8 种语言。
