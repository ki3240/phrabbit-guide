  - title: 안 들리는 부분만 골라서 반복
    summary: 자막 카드를 탭한 뒤 A/B 핸들을 끌어 듣고 싶은 구간에 집중하세요. 음원은 파형을 한 줄에 2~15초까지 확대할 수 있어요.
    details: 배속, 반복 횟수, 반복 사이 간격을 조절하세요. 내 목소리를 녹음해 원음과 비교하거나, 들은 문장을 받아쓸 수 있어요.
