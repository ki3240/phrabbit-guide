ipad_title: iPad에서 듣고, 바로 손으로 써 보세요
ipad_player: 가로 화면에서 영상과 자막 카드를 나란히 보며 연습해요.
ipad_handwriting: Apple Pencil로 받아쓰고 원문과 맞춰 보며 직접 고쳐요.
privacy_title: 내 녹음은 내 기기에
privacy_intro: 회의 녹음, 자막, 쉐도잉 녹음은 Phrabbit 개발자 서버에 전송되지 않아요. 지원하는 언어 모델을 받아 두면 내 음원을 오프라인에서도 자막으로 만들고 연습할 수 있어요.
privacy_note: 음성 자막은 사용 가능한 경우 기기 내 모델로 생성하며, Apple Intelligence 번역과 해설도 기기에서 처리해요. 일부 구형 OS나 기기 내 모델을 지원하지 않는 언어에서는 Apple 음성인식 서비스로 전환되어 오디오가 Apple에 전송될 수 있어요. 언어 모델 다운로드와 YouTube·팟캐스트 스트리밍에는 네트워크가 필요해요.
pricing_title: 무료와 프리미엄
pricing_intro: 3일(72시간) 동안 모든 기능을 써보세요. 체험이 끝나면 자동 결제 없이 무료 버전으로 계속 쓸 수 있어요. 현재 프리미엄 기능은 한 번 구매해 이용할 수 있어요.
pricing_note: 현재 가격은 App Store에서 확인하세요. 구매할 때 사용한 Apple 계정으로 로그인한 iPhone·iPad에서 구매를 복원할 수 있어요.
