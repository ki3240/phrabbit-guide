hero_alt: 파형에서 선택한 A/B 구간과 그 구간의 영어 문장 아래에 한국어 번역이 표시된 화면
features:
  - title: 평소 보고 듣는 자료로 공부하세요
    summary: YouTube 임베드 플레이어, 검색·RSS로 가져온 팟캐스트, 내 음원·영상·회의 녹음, DRM 없는 음악을 한 앱에서 연습할 수 있어요.
    details: 로컬 영상에 SRT·VTT·SMI 자막을 추가하세요. 지원되는 자막이 있는 YouTube 영상은 자막 카드로도 연습할 수 있어요.
