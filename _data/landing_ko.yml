      - {id: shadow, alt: 원음과 쉐도잉 녹음을 비교하는 화면}
  - title: 기기에서 만든 자막으로 들은 내용을 확인
    summary: 내 음원과 다운로드한 팟캐스트에서 파형과 맞물리는 자막 카드를 만들고, 로컬 영상에서 연습할 부분을 골라 자막으로 변환하세요.
    details: 연습 중 자막을 가리거나 편집하세요. 지원 기기에서는 Apple Intelligence로 자막을 번역하고 단어 해설을 본 뒤, 단어장과 플래시카드로 복습할 수 있어요.
