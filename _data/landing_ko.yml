cta_title: 꼭 듣고 싶은 그 한 문장부터
more_questions: 자주 묻는 질문 모두 보기
faq:
  - question: 무료 체험이 끝나면 자동으로 결제되나요?
    answer: 아니요. 72시간 체험이 끝나면 무료 기능을 계속 쓸 수 있어요. 프리미엄을 직접 구매할 때만 한 번 결제해요. 같은 Apple 계정으로 로그인한 iPhone이나 iPad에서 구매를 복원할 수 있어요.
  - question: YouTube나 팟캐스트, 내 MP3·MP4 파일과 회의 녹음도 쓸 수 있나요?
    answer: 로컬 음원·영상과 개인 녹음, DRM 없는 뮤직 라이브러리 음원을 쓸 수 있어요. Apple Music 구독 음원은 DRM 보호를 받아요. 팟캐스트는 검색·RSS 추가·프리미엄 다운로드를 지원하고, YouTube는 임베드 재생을 이용해요. 로컬 영상에는 SRT·VTT·SMI 자막을 붙일 수 있어요.
  - question: 안 들린 1~2초만 골라서 반복할 수 있나요?
    answer: 네. 자막 카드를 탭하고 A/B 핸들을 끌어 범위를 좁히세요. 음원은 파형에서, 로컬 영상과 YouTube는 시간 눈금자에서 조절해요. 배속과 반복 횟수, 반복 사이 간격도 바꿀 수 있어요.
  - question: 회의 녹음이나 개인 음성 파일을 기기 안에서 자막으로 만들 수 있나요?
    answer: 지원되는 기기 내 언어 모델을 설치하면 회의 녹음도 기기 안에서 자막으로 만들 수 있어요. 녹음은 Phrabbit 개발자 서버에 전송되지 않아요. 기기에서 음성을 인식할 수 없으면 Apple 음성인식 서비스가 오디오를 받아 처리할 수 있어요.
  - question: 오프라인에서 연습하거나 자막을 만들 수 있나요?
    answer: 지원하는 기기 내 언어 모델을 설치한 상태라면 내 파일과 다운로드한 팟캐스트로 오프라인에서 자막을 생성하고 연습할 수 있어요. YouTube 스트리밍과 새 팟캐스트·언어 모델 다운로드에는 네트워크가 필요해요.
  - question: 쉐도잉 녹음과 받아쓰기는 어떻게 하나요?
    answer: 프리미엄 또는 체험 기간에는 내 목소리를 녹음해 원음과 비교하고 저장할 수 있어요. 키보드로 쓴 답은 자막과 자동으로 비교하고, iPad 손글씨는 원문을 보며 직접 확인해요.
  - question: AI 자막 번역과 단어 해설은 어떤 기기에서 동작하나요?
    answer: AI 자막 번역은 iOS·iPadOS 26.4 이상, 단어 해설은 26 이상에서 이용할 수 있어요. 두 기능 모두 Apple Intelligence 지원 기기에서 기능과 모델이 준비되어 있고 언어를 지원해야 하며, 프리미엄 또는 체험 기간이 필요해요.
  - question: 자막을 만드는 동안 앱을 닫거나 화면을 잠근 채 들을 수 있나요?
    answer: 자막을 만드는 동안 앱을 열어 두세요. 프리미엄 또는 체험 기간에는 백그라운드 재생을 켜고 로컬 음원과 다운로드한 팟캐스트를 들을 수 있어요. YouTube를 포함한 영상은 백그라운드에서 일시 정지돼요.
  - question: 어떤 언어로 연습할 수 있나요?
    answer: 영어·일본어·한국어·중국어·스페인어 등 원하는 언어의 자료로 반복하고 따라 말할 수 있어요. 자동 자막과 번역은 언어·기기·설치한 모델에 따라 지원 범위가 달라요. 앱과 사용 설명서는 8개 언어로 제공돼요.
