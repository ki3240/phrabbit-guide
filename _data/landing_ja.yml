faq:
  - question: 無料体験が終わると自動で課金されますか？
    answer: いいえ。72時間の体験が終わると無料版を引き続き使えます。料金が発生するのはプレミアムを購入したときだけです。同じApple AccountでiPhoneやiPadに購入を復元できます。
  - question: どんな音声や動画を教材にできますか？
    answer: MP3・M4A・MP4などのファイル、会議・音声メモなどの録音、DRM保護のないミュージックライブラリの曲に対応します。Apple Musicのサブスクリプション楽曲にはDRM保護があります。ポッドキャストは検索・RSS追加・プレミアムでのダウンロードが可能。YouTubeの埋め込み再生とローカル動画のSRT・VTT・SMI字幕にも対応します。
  - question: 聞き取れなかった1〜2秒だけをリピートできますか？
    answer: はい。字幕をタップしてA/Bハンドルで区間を絞れます。音声では波形、ローカル動画とYouTubeでは時間目盛りを使います。速度、回数、間隔も調整できます。
  - question: 会議や個人的な録音は端末内で文字起こしできますか？
    answer: 対応する端末内モデルがあれば、会議の録音も端末内で文字起こしできます。Phrabbitの開発者サーバーに音声は送られません。端末内で認識できない場合は、Appleの音声認識サービスに音声が送られることがあります。
  - question: オフラインで練習や字幕生成はできますか？
    answer: 対応する端末内モデルがあれば、手持ちのファイルやダウンロード済みポッドキャストをオフラインで文字起こし・練習できます。YouTubeの再生や新しいポッドキャスト、言語モデルの取得には通信が必要です。
  - question: シャドーイング録音やディクテーションはどう使いますか？
    answer: プレミアムまたは体験期間中は、自分の録音と原音を聞き比べて保存できます。キーボードで入力した答えは字幕と自動照合できます。iPadの手書きでは、原文を見ながら自分で答え合わせします。
  - question: AI字幕翻訳と単語解説に必要な端末は？
    answer: AI字幕翻訳はiOS・iPadOS 26.4以降、単語解説は26以降です。いずれもApple Intelligence対応端末で機能とモデルが利用可能であること、言語が対応していること、プレミアムまたは体験期間中であることが必要です。
  - question: 文字起こし中にアプリを閉じたり、画面ロック中に聴いたりできますか？
    answer: 字幕を生成している間はアプリを開いておいてください。プレミアムまたは体験期間中に「バックグラウンド再生」を有効にすると、音声ファイルやダウンロード済みポッドキャストを聴けます。YouTubeを含む動画再生はバックグラウンドで一時停止します。
  - question: どの言語の学習に使えますか？
    answer: 英語、日本語、韓国語、中国語、スペイン語など、好きな言語の音声でリピートやシャドーイングができます。自動字幕と翻訳の対応範囲は言語、端末、インストール済みモデルによって異なります。アプリとガイドは8言語に対応しています。
