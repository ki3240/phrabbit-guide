features:
  - title: Study with what you already listen to
    summary: Open YouTube in the embedded player, find podcasts by search or RSS, or import local audio, video, voice recordings, and DRM-free music.
    details: Add SRT, VTT, or SMI subtitles to a local video. Practice with subtitle cards when a YouTube video has supported captions.
    images:
      - {id: add, alt: "Import menu with audio, video, podcast and YouTube options"}
      - {id: youtube, alt: The café video with an A/B range on the time ruler and the matching subtitle card selected}
  - title: Repeat the part that trips you up
    summary: Tap a subtitle card, then drag the A/B handles to isolate the phrase. For audio files, zoom the waveform to 2–15 seconds per row.
    details: Adjust the playback speed, repeat count, and pause between loops. Record a take and compare it with the original, or try writing down what you heard.
    images:
      - {id: loop, alt: An A/B loop around a phrase on the audio player waveform}
      - {id: shadow, alt: Shadowing controls for comparing the original with a recording}
  - title: Follow along with on-device subtitles
    summary: Turn audio and downloaded podcasts into subtitle cards synced to the waveform, or transcribe a section of a local video.
    details: Hide or edit subtitles as you practice. On supported devices, translate subtitles and get Apple Intelligence word explanations, then save words to review with flashcards.
    images:
      - {id: translation, alt: Original subtitle cards with translated lines}
      - {id: word-detail, alt: The word traffic saved with its sentence in the Wordbook}
