privacy_title: Keep your recordings on your device
privacy_intro: Meeting recordings, transcripts, and shadowing takes are never sent to Phrabbit’s developer servers. After downloading a supported language model, you can transcribe and practice with local audio offline.
privacy_note: Speech-to-text uses on-device models when available. Apple Intelligence translation and explanations run on device. On some older systems or for languages without a supported local model, speech recognition can fall back to Apple’s service and send audio to Apple. Model downloads and YouTube or podcast streaming require a connection.
pricing_title: Free and Premium
pricing_intro: Try all features for 3 days (72 hours). When the trial ends, you can keep using the free version without being charged. A one-time purchase unlocks all current Premium features.
pricing_note: Check the App Store for current local pricing. Use Restore Purchase on iPhone or iPad with the Apple Account you used to buy Premium.
