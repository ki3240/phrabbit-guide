faq:
  - question: Does the free trial charge me when it ends?
    answer: No. The 72-hour trial ends automatically and the free features stay available. You only pay if you choose the one-time Premium purchase. You can restore it on iPhone or iPad with the same Apple Account.
  - question: Which audio, video, and other study materials can I use?
    answer: Use local files such as MP3, M4A and MP4, including voice recordings, or import DRM-free Music library tracks. Apple Music subscription tracks are DRM-protected. Phrabbit supports podcast search, RSS and Premium downloads, embedded YouTube streaming, and SRT, VTT or SMI subtitles for local videos.
  - question: Can I repeat just the one or two seconds I missed?
    answer: Yes. Start with a subtitle card and drag the A/B handles to narrow the loop. Audio uses a waveform. Local videos and YouTube use a time ruler. You can adjust speed, repeat count, and the gap between repetitions.
  - question: Can I transcribe a private voice or meeting recording on device?
    answer: With a supported on-device language model installed, you can transcribe meeting recordings locally. Phrabbit never receives your audio. If local recognition is unavailable, Apple’s speech service may process the audio on its servers.
  - question: Can I practice or generate subtitles offline?
    answer: With a supported on-device language model already installed, local files and downloaded podcasts can be used for offline transcription and practice. Streaming YouTube and downloading new podcast episodes or language models require a connection.
  - question: How do shadowing recordings and dictation work?
    answer: During Premium or the trial, compare your voice with the original and save your takes. Check a typed answer against the subtitle automatically, or compare your handwriting with the original yourself on iPad.
  - question: Which devices support AI translation and word explanations?
    answer: AI subtitle translation requires iOS or iPadOS 26.4 or later. Word explanations require version 26 or later. Both need a supported Apple Intelligence device, Apple Intelligence enabled and ready, supported languages, and Premium or an active trial.
  - question: Can I leave the app during transcription or keep listening with the screen locked?
    answer: Keep the app open while generating subtitles. Enable Background playback during Premium or the trial for audio files and downloaded podcasts. Video playback, including YouTube, pauses in the background.
  - question: Which languages can I practice?
    answer: Loop and shadow recordings in English, Japanese, Korean, Chinese, Spanish, and other languages. Automatic subtitle and translation support varies by language, device, and installed models. The app and manuals are available in eight languages.
